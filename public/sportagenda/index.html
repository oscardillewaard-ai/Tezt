<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Plan je trainingen, vink af wat je gedaan hebt en houd je gymschema's bij." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sportagenda" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sportagenda</title>
  </head>
  <body>
    <header class="topbar">
      <h1 id="title">Sportagenda</h1>
    </header>

    <main id="view"></main>

    <button id="fab" class="fab" type="button" aria-label="Training toevoegen">+</button>

    <nav class="tabbar">
      <button type="button" data-tab="week" class="active"><span>📅</span>Week</button>
      <button type="button" data-tab="overzicht"><span>📊</span>Overzicht</button>
      <button type="button" data-tab="schemas"><span>🏋️</span>Schema's</button>
      <button type="button" data-tab="meer"><span>⚙️</span>Meer</button>
    </nav>

    <dialog id="sheet"></dialog>

    <script src="app.js"></script>
  </body>
</html>
