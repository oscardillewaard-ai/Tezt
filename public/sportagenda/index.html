<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Plan je trainingen, vink af wat je gedaan hebt en houd je gymschema's bij." />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tarapp" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes.css" />
    <script>
      // Het gekozen thema meteen zetten, zodat je bij het openen geen flits van een ander thema ziet.
      try {
        var thema = (JSON.parse(localStorage.getItem('sportagenda.v1') || '{}').settings || {}).theme
        if (thema && thema !== 'klassiek') document.documentElement.setAttribute('data-thema', thema)
      } catch (e) {}
    </script>
    <title>Tarapp</title>
  </head>
  <body>
    <header class="topbar">
      <h1 id="title">Tarapp</h1>
      <div id="top-actions"></div>
    </header>

    <main id="view"></main>

    <button id="fab" class="fab" type="button" aria-label="Training toevoegen">+</button>

    <nav class="tabbar">
      <button type="button" data-tab="week" class="active"><span data-icon="agenda"></span>Agenda</button>
      <button type="button" data-tab="overzicht"><span data-icon="overzicht"></span>Overzicht</button>
      <button type="button" data-tab="schemas"><span data-icon="schemas"></span>Schema's</button>
      <button type="button" data-tab="meer"><span data-icon="meer"></span>Meer</button>
    </nav>

    <dialog id="sheet"></dialog>

    <script src="icons.js"></script>
    <script src="plan5k.js"></script>
    <script src="app.js"></script>
  </body>
</html>
