<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nopav.es is verhuisd</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://oscardillewaard-ai.github.io/nopaves/">
<script>
  // Nopav.es staat nu op https://oscardillewaard-ai.github.io/nopaves/.
  // Meld de oude service worker af, wis de oude app-caches (onverhard-*) en stuur door
  // met behoud van querystring en hash, zodat gedeelde routelinks blijven werken.
  // De datacache (nopaves-data-*) blijft staan: die gebruikt de nieuwe app ook.
  (function () {
    var doel = 'https://oscardillewaard-ai.github.io/nopaves/' + location.search + location.hash
    var ga = function () { location.replace(doel) }
    var wis = function () {
      if (!window.caches) return Promise.resolve()
      return caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('onverhard-') === 0 })
          .map(function (k) { return caches.delete(k) }))
      })
    }
    var wacht = function (ms) { return new Promise(function (r) { setTimeout(r, ms) }) }
    // Eerst afmelden, dan wissen: de oude service worker bewaart deze pagina nog in zijn cache
    // terwijl ze laadt, dus wissen we na een korte pauze nog een keer.
    var klaar = Promise.resolve().then(function () {
      if (!('serviceWorker' in navigator)) return
      return navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.filter(function (r) { return r.scope.indexOf('/Tezt/onverhard/') !== -1 })
          .map(function (r) { return r.unregister() }))
      })
    }).then(wis).then(function () { return wacht(300) }).then(wis)
    var weg = setTimeout(ga, 1500)
    klaar.then(function () { clearTimeout(weg); ga() }, function () { clearTimeout(weg); ga() })
  })()
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #DDE5B3; color: #2E3320;
         font: 18px/1.5 Karla, system-ui, sans-serif; }
  main { background: #F1F3D4; border: 2px solid #2E3320; padding: 24px; margin: 16px; max-width: 28em; }
  h1 { font-size: 1.4em; margin: 0 0 8px; }
  a { color: #4F6B2A; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    body { background: #1E2215; color: #F1F3D4; }
    main { background: #2E3320; border-color: #9BC046; }
    a { color: #9BC046; }
  }
</style>
</head>
<body>
<main>
  <h1>Nopav.es is verhuisd</h1>
  <p>De app staat nu op <a id="link" href="https://oscardillewaard-ai.github.io/nopaves/">oscardillewaard-ai.github.io/nopaves</a>.
  Je bewaarde routes en instellingen gaan mee.</p>
</main>
<script>document.getElementById('link').href = 'https://oscardillewaard-ai.github.io/nopaves/' + location.search + location.hash</script>
</body>
</html>
