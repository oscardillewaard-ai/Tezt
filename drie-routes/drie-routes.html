<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Drie routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#172033; --muted:#566074; --line:#D2D8E0;
  --noten:#2B59C3; --noten-soft:#DDE6FA;
  --akkoord:#1C7655; --akkoord-soft:#D5EEE4;
  --impro:#A0347A; --impro-soft:#F5DDEC;
  --primary:#172033; --on-primary:#FFFFFF;
  --ok:#1C7655; --on-ok:#FFFFFF; --bad:#B23E2C; --on-bad:#FFFFFF;
  --key-white:#FFFFFF; --key-black:#1A2030; --key-edge:#B4BDC9;
  --paper:#FFFFFF; --paper-ink:#141A26;
  --focus:#2B59C3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131C; --surface:#161D2A; --surface-2:#1B2333; --ink:#E6EAF1; --muted:#A1AAB9; --line:#2A3345;
    --noten:#8AA8FF; --noten-soft:#212E55;
    --akkoord:#5CC69C; --akkoord-soft:#15372B;
    --impro:#E58AC3; --impro-soft:#3D1F34;
    --primary:#E6EAF1; --on-primary:#0E131C;
    --ok:#5CC69C; --on-ok:#0E131C; --bad:#F08976; --on-bad:#0E131C;
    --key-white:#F2F4F7; --key-black:#090C12; --key-edge:#3A4458;
    --paper:#FBFBF9; --paper-ink:#141A26;
    --focus:#8AA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#161D2A; --surface-2:#1B2333; --ink:#E6EAF1; --muted:#A1AAB9; --line:#2A3345;
  --noten:#8AA8FF; --noten-soft:#212E55;
  --akkoord:#5CC69C; --akkoord-soft:#15372B;
  --impro:#E58AC3; --impro-soft:#3D1F34;
  --primary:#E6EAF1; --on-primary:#0E131C;
  --ok:#5CC69C; --on-ok:#0E131C; --bad:#F08976; --on-bad:#0E131C;
  --key-white:#F2F4F7; --key-black:#090C12; --key-edge:#3A4458;
  --paper:#FBFBF9; --paper-ink:#141A26;
  --focus:#8AA8FF;
  color-scheme:dark;
}
html{ background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
button, input, select, textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:720px; margin:0 auto; padding:8px 16px 112px; }
.in-session .wrap{ padding-bottom:0; }
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; }
.brand{ margin:0; font-size:21px; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; }
.mark{ display:inline-flex; gap:3px; align-items:flex-end; height:20px; }
.mark i{ display:block; width:5px; border-radius:3px; }
.mark i:nth-child(1){ height:11px; background:var(--noten); }
.mark i:nth-child(2){ height:20px; background:var(--akkoord); }
.mark i:nth-child(3){ height:15px; background:var(--impro); }
.brand{ white-space:nowrap; }
.hright{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; min-width:0; }
.sync{ font-size:13px; line-height:1.3; color:var(--muted); text-align:right; }
.pchip{ appearance:none; flex:none; display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:2px 10px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; }
.pchip i{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--muted); }
.pchip[data-s="on"] i{ background:var(--ok); border-color:var(--ok); }
.pchip[data-s="blocked"] i, .pchip[data-s="error"] i, .pchip[data-s="none"] i{ background:var(--bad); border-color:var(--bad); }
h2{ font-size:26px; line-height:1.15; margin:18px 0 6px; letter-spacing:-0.01em; text-wrap:balance; }
h3{ font-size:19px; line-height:1.25; margin:26px 0 8px; text-wrap:balance; }
p{ margin:8px 0; }
.muted{ color:var(--muted); }
.small{ font-size:15px; }
ul.plain{ padding-left:1.2em; }
ul.plain li{ margin:6px 0; }
.r-noten{ --rc:var(--noten); --rs:var(--noten-soft); --kmark:#C9D7FA; --kon:#2B59C3; }
.r-akkoord{ --rc:var(--akkoord); --rs:var(--akkoord-soft); --kmark:#C0E6D6; --kon:#1C7655; }
.r-impro{ --rc:var(--impro); --rs:var(--impro-soft); --kmark:#F2CDE3; --kon:#A0347A; }
.rname{ color:var(--rc); font-weight:700; }

.btn{ appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); border-radius:10px; min-height:48px; padding:10px 18px; font-weight:700; cursor:pointer; text-align:center; }
.btn.primary{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.btn.ghost{ border-color:var(--line); font-weight:400; background:var(--surface); }
.btn.ghost[aria-pressed="true"]{ border-color:var(--rc, var(--ink)); box-shadow:inset 0 0 0 1.5px var(--rc, var(--ink)); font-weight:700; }
.btn.wide{ width:100%; }
.btn.ok{ border-color:var(--ok); background:var(--ok); color:var(--on-ok); }
.btn.bad{ border-color:var(--bad); color:var(--bad); background:transparent; }
.btn.suggest{ outline:3px solid var(--focus); outline-offset:2px; }
.btn[data-armed="1"]{ background:var(--bad); border-color:var(--bad); color:var(--on-bad); }
.btn:disabled{ opacity:.5; cursor:default; }
.link{ appearance:none; background:none; border:0; padding:10px 4px; min-height:44px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.link[data-armed="1"]{ color:var(--bad); font-weight:700; }

.timekeys{ margin:14px 0 8px; user-select:none; -webkit-user-select:none; }
.timekeys .fall{ height:10px; background:var(--key-black); border-radius:7px 7px 0 0; }
.timekeys .row{ position:relative; display:grid; grid-template-columns:repeat(6,1fr); height:160px; }
.tkey{ appearance:none; position:relative; margin:0; border:1px solid var(--key-edge); border-top:0; border-left-width:0; background:var(--key-white); color:var(--paper-ink); border-radius:0 0 9px 9px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 0 14px; cursor:pointer; transition:transform .08s ease, background-color .15s ease; }
.tkey:first-child{ border-left-width:1px; }
.tkey b{ font-size:25px; line-height:1; }
.tkey span{ font-size:13px; color:#5B6475; margin-top:3px; }
.tkey[aria-pressed="true"]{ background:#D9E3F7; transform:translateY(3px); box-shadow:inset 0 -6px 0 #2B59C3; }
.tkey:active{ transform:translateY(2px); }
.bkey{ position:absolute; top:0; width:9.4%; height:55%; background:var(--key-black); border-radius:0 0 5px 5px; pointer-events:none; z-index:1; }

.plan{ list-style:none; margin:8px 0 16px; padding:0; }
.plan li{ display:grid; grid-template-columns:5px 1fr auto; column-gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.plan li:last-child{ border-bottom:1px solid var(--line); }
.bar{ align-self:stretch; border-radius:3px; background:var(--rc); }
.plan .t{ font-weight:700; }
.plan .s{ font-size:15px; color:var(--muted); }
.plan .m{ font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.next{ margin:22px 0 0; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); }
.next .btnrow{ margin-top:10px; }

.blockhead{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:4px; }
.prog{ font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; }
.kind{ font-size:14px; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--rs); color:var(--rc); border:1.5px solid transparent; }
.kind.check{ background:transparent; border-color:var(--rc); }
.block h2{ margin-top:10px; }
.help{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin:0 0 12px; font-size:15px; color:var(--muted); }
.dots{ display:inline-flex; gap:4px; }
.dots i{ width:10px; height:10px; border-radius:50%; border:1.5px solid var(--rc); }
.dots i.f{ background:var(--rc); }
.paper{ background:var(--paper); color:var(--paper-ink); border:1px solid var(--line); border-radius:10px; padding:4px 2px; overflow:hidden; }
.paper .abcjs-chord{ fill:var(--kon, #1C7655); font-weight:700; }
.paper .abcjs-annotation{ fill:#5B6475; }
.paper .hard, .paper .hard *{ fill:#B23E2C; }
.paper .cur, .paper .cur *{ fill:var(--kon, #2B59C3); }
.paper .err, .paper .err *{ fill:#B23E2C; }
.loading{ margin:0; padding:24px 12px; text-align:center; color:#566074; font-size:15px; }
.fb{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:8px; }
@media (min-width:560px){ .fb{ grid-template-columns:repeat(4,1fr); } }
.fbb{ border:1px solid #D2D8E0; border-radius:6px; padding:6px 8px; font-size:18px; }
.fbb small{ display:block; font-size:11px; color:#6A7385; }
.fbc{ font-weight:700; min-height:1.2em; }
.kbwrap{ margin:12px 0 4px; }
.kb{ display:block; width:100%; height:auto; max-height:180px; }
.kb rect.w{ fill:var(--key-white); stroke:var(--key-edge); stroke-width:1; }
.kb rect.b{ fill:var(--key-black); }
.kb g.rh rect.w{ fill:var(--kmark); }
.kb g.lh rect.w{ fill:#F0DDA6; }
.kb g.rh rect.b{ fill:var(--kon); }
.kb g.lh rect.b{ fill:#8A6D12; }
.kb g.on rect.w{ fill:var(--kon); }
.kb g.on rect.b{ fill:var(--kmark); }
.kb g.on text{ fill:#FFFFFF; }
.kb g.press rect.w{ fill:#FFD47A; }
.kb g.press rect.b{ fill:#C98A00; }
.kb g.bad rect.w{ fill:#F3B4A8; }
.kb g.bad rect.b{ fill:#B23E2C; }
.kb text{ font:700 var(--fs, 12px) "Atkinson Hyperlegible", system-ui, sans-serif; text-anchor:middle; fill:#141A26; }
.kb text.bk{ font-size:var(--bfs, 9px); fill:#FFFFFF; }
.kb .mc{ fill:#7D8798; }
.kblegend{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14px; color:var(--muted); margin-top:6px; }
.kblegend span{ display:inline-flex; align-items:center; gap:6px; }
.sw{ width:14px; height:14px; border-radius:3px; border:1px solid var(--key-edge); display:inline-block; }
.sw.rh{ background:var(--kmark); }
.sw.lh{ background:#F0DDA6; }
.sw.press{ background:#FFD47A; }
.sw.mc{ width:8px; height:8px; border-radius:50%; background:#7D8798; border:0; }
.note-box{ margin:12px 0; padding:10px 14px; background:var(--surface); border-left:4px solid var(--rc); border-radius:0 10px 10px 0; }
.live{ margin:12px 0; padding:10px 14px; background:var(--surface); border:1.5px dashed var(--rc); border-radius:10px; font-size:15px; }
.live b{ color:var(--rc); }
.live .btnrow{ margin-top:8px; }
.live .btnrow .btn{ flex:0 1 auto; min-height:44px; padding:8px 14px; font-size:15px; }
.steps{ margin:12px 0 4px; padding-left:1.4em; font-size:18px; }
.steps li{ margin:6px 0; padding-left:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
.chip{ appearance:none; min-width:46px; min-height:46px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer; }
.chip[aria-pressed="true"]{ border-color:var(--bad); color:var(--bad); box-shadow:inset 0 0 0 1.5px var(--bad); }
.controls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0 4px; }
.tempo{ display:inline-flex; align-items:center; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); }
.tempo button{ appearance:none; width:46px; height:46px; border:0; background:none; font-size:22px; cursor:pointer; border-radius:9px; }
.tempo output{ min-width:76px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
.status{ min-height:1.5em; margin:6px 0; font-size:15px; color:var(--muted); }
.chart{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.chart button{ appearance:none; position:relative; min-height:58px; border:1.5px solid var(--key-edge); border-radius:9px; background:var(--paper); color:var(--paper-ink); font-size:20px; font-weight:700; cursor:pointer; word-spacing:6px; padding:14px 4px 6px; }
.chart button small{ position:absolute; top:3px; left:7px; font-size:11px; font-weight:400; color:#6A7385; word-spacing:0; }
.chart button.sel{ background:var(--kmark); }
.chart button.cur{ border-color:var(--kon); box-shadow:inset 0 0 0 2px var(--kon); }
.actionbar{ position:sticky; bottom:0; z-index:5; display:flex; align-items:center; gap:10px; margin:18px -16px 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--bg); border-top:1px solid var(--line); }
.actionbar .grow{ flex:1; min-width:0; }
.timer{ font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; min-width:76px; }
.timer.up{ color:var(--bad); }

.sum{ display:grid; grid-template-columns:1fr auto; margin:14px 0 12px; border-top:1px solid var(--line); }
.sum dt, .sum dd{ margin:0; padding:10px 0; border-bottom:1px solid var(--line); }
.sum dd{ font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.btnrow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.btnrow .btn{ flex:1 1 180px; }

.songs{ margin:12px 0 0; padding-left:1.5em; }
.songs > li{ padding:14px 0 16px; border-top:1px solid var(--line); }
.songs > li::marker{ font-weight:700; color:var(--muted); }
.songs h3{ margin:0; }
.rrow{ display:grid; grid-template-columns:5px 1fr auto; column-gap:12px; align-items:center; padding:8px 0; }
.rrow > span{ min-width:0; }
.rrow .btn{ min-height:44px; padding:8px 12px; font-size:15px; }
.tag{ display:inline-block; font-size:13px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin-left:6px; vertical-align:2px; }

.metric{ display:flex; align-items:baseline; gap:12px; margin:10px 0; }
.metric b{ flex:none; font-size:32px; line-height:1; font-variant-numeric:tabular-nums; min-width:84px; }
.rbars .row{ display:grid; grid-template-columns:7.4em 1fr auto; gap:10px; align-items:center; margin:10px 0; font-size:15px; }
.track{ height:10px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
.track i{ display:block; height:100%; background:var(--rc); }
.days, .dayl{ display:grid; grid-template-columns:repeat(14,1fr); gap:4px; }
.days span{ aspect-ratio:1; max-width:100%; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); }
.days span.on{ background:var(--ink); border-color:var(--ink); }
.days span.today{ outline:2px solid var(--focus); outline-offset:1px; }
.dayl span{ font-size:11px; color:var(--muted); text-align:center; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:grid; grid-template-columns:5px 1fr auto; column-gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
.hist li > span{ min-width:0; }
.hist .res{ font-weight:700; }
.hist .res.ok{ color:var(--ok); }
.hist .res.no{ color:var(--bad); }

.field{ display:grid; gap:6px; margin:12px 0; min-width:0; }
.field label{ font-weight:700; font-size:15px; }
.field input, .field select, .field textarea{ width:100%; min-height:48px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
.field textarea{ min-height:170px; resize:vertical; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:15px; line-height:1.45; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.errbox{ margin:10px 0; padding:10px 14px; border-left:4px solid var(--bad); background:var(--surface); border-radius:0 10px 10px 0; }
.errbox p{ margin:4px 0; }
code, .code{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.92em; background:var(--surface-2); border:1px solid var(--line); padding:0 5px; border-radius:5px; }
pre.ex{ margin:8px 0; padding:10px 12px; overflow-x:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font-size:14px; line-height:1.45; }
.dl{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:8px 0; font-size:15px; }
.dl dt{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:700; }
.dl dd{ margin:0; color:var(--muted); }

.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px)); }
.tabs .in{ max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.tabs button{ appearance:none; position:relative; background:none; border:0; min-height:52px; font-size:15px; color:var(--muted); cursor:pointer; border-radius:10px; }
.tabs button[aria-current="page"]{ color:var(--ink); font-weight:700; }
.tabs button[aria-current="page"]::before{ content:""; position:absolute; top:-4px; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--ink); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- Inhoud ---------- */
const ABCJS_URLS = ['https://cdn.jsdelivr.net/npm/abcjs@6.7.1/dist/abcjs-basic-min.js', 'https://unpkg.com/abcjs@6.7.1/dist/abcjs-basic-min.js'];
const LS_KEY = 'drieroutes.v1';
const LS_SONGS = 'drieroutes.songs.v1';
const LS_DEV = 'drieroutes.device.v1';
const MAX_HIST = 800;
const CHECK_MIN = 2;
const CHECK_SHARE = 0.6;
const INTERVALS = [2, 4, 7, 14, 30, 60];
const TIME_OPTIONS = [5, 10, 15, 20, 30, 45];
const TIME_NOTES = [60, 62, 64, 65, 67, 69];
const STOP_MIN_SEC = 2;
const STOP_FACTOR = 2.5;
const GROUP_SEC = 0.12;

const ROUTES = [
  { id: 'noten', name: 'Noten' },
  { id: 'akkoord', name: 'Akkoorden' },
  { id: 'impro', name: 'Improviseren' }
];
const ROUTE = {};
ROUTES.forEach((r, i) => { ROUTE[r.id] = r; r.i = i; });
const HELP = ['geen hulp', 'weinig hulp', 'veel hulp'];
const HELP_WITH = ['zonder hulp', 'met weinig hulp', 'met veel hulp'];
const PC = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'B♭', 'B'];
const PC_SHARP = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const PC_FLAT = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
const WHITE = [0, 2, 4, 5, 7, 9, 11];
const LH_FINGERS = ['pink', 'ringvinger', 'middelvinger', 'wijsvinger', 'duim'];

/* Liedjes in ABC-notatie: een kwartnoot is één tel, "C" boven een noot is het akkoord dat daar begint. */
const SONG_SRC = [
  { id: 'clair', title: 'Au clair de la lune', origin: 'Frans volksliedje, in het Nederlands In de maneschijn; eerste helft',
    intro: 'Drie noten: C, D en E. Je duim ligt op C.',
    abc: '"C"C C C D | "C"E2 "G"D2 | "C"C E "G"D D | "C"C4 | "C"C C C D | "C"E2 "G"D2 | "C"C E "G"D D | "C"C4 |]' },
  { id: 'ode', title: 'Ode an die Freude', origin: 'Beethoven, thema uit de Negende symfonie, ritme vereenvoudigd',

/* ---------- Opslag in je account (db), anders lokaal ---------- */
const cloud = { status: 'init', ref: null, sref: null, writing: false, pending: false, retried: false, swriting: false, spending: false, err: null, dl: null };

}

  }
}
async function writeSongsCloud(){
  if (!cloud.sref) return;

  cloud.swriting = true;

}

}
function applyRemoteSongs(remote){
  const merged = mergeSongs(customSrc, remote || {});
  if (JSON.stringify(merged) === JSON.stringify(customSrc)) return false;
  customSrc = merged;
  saveJSON(LS_SONGS, { v: 1, songs: customSrc });

async function initCloud(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function'){ cloud.status = 'local'; renderSync(); return; }
  C.use('downloads').then(d => { cloud.dl = d || null; if (cloud.dl && ui.tab === 'voortgang' && !session) render(); }, () => { cloud.dl = null; });
  try {
    const both = await Promise.all([C.use('db'), C.use('user')]);
    const db = both[0], user = both[1];
    const uid = user ? await user.id() : null;
    if (!db || !uid){ cloud.status = 'local'; renderSync(); return; }
    const col = db.collection('data/users/' + uid);
    const ref = col.doc('state'), sref = col.doc('songs');
    const both2 = await Promise.all([ref.get(), sref.get()]);
    const remote = both2[0].exists ? both2[0].data() : null;
    const rsongs = both2[1].exists ? both2[1].data() : null;
    const songsChanged = applyRemoteSongs(rsongs && rsongs.songs);
    const localNewer = (state.updatedAt || 0) > ((remote && remote.updatedAt) || 0);
    state = mergeStates(state, remote);
    saveLocal();
    cloud.ref = ref; cloud.sref = sref; cloud.status = 'synced';
    if (localNewer) await writeCloud();
    if (Object.keys(customSrc).length && JSON.stringify(customSrc) !== JSON.stringify((rsongs && rsongs.songs) || {})) writeSongsCloud();
    if (!isBusy() && !ui.edit) render(); else renderSync();
    if (songsChanged) state = normalize(state);
    ref.onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if ((r.updatedAt || 0) === (state.updatedAt || 0) && (r.epochAt || 0) === (state.epochAt || 0)) return;
      state = mergeStates(state, r);
      saveLocal();
      if (!isBusy() && !ui.edit) render(); else renderSync();
    }, e => { cloudFail(e && e.code ? e : { code: 'revoked' }); renderSync(); });
    sref.onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if (applyRemoteSongs(r && r.songs)){ state = normalize(state); if (!isBusy() && !ui.edit) render(); }
    }, () => { /* liedjes blijven lokaal */ });
  } catch (e) {
    cloud.status = 'local'; cloud.ref = null; cloud.sref = null; renderSync();
  }
}

/* ---------- Oefenlogica ---------- */
function itemId(songId, routeId){ return songId + ':' + routeId; }
function startSong(songId){
  if (!SONG[songId]) return;
  if (!state.started.includes(songId)) state.started.push(songId);
  const st = new Set(state.started);
  state.started = SONGS.map(s => s.id).filter(id => st.has(id)).concat(state.started.filter(id => !SONG[id]));
  ROUTES.forEach(r => {
    const id = itemId(songId, r.id);
    if (!state.items[id]) state.items[id] = { id, song: songId, route: r.id, level: 2, streak: 0, fails: 0, nextCheck: null, lastPractice: null, lastCheck: null, hard: [], bpm: 60, t: 0 };
  });
}
function songItems(){
  const out = [];
  state.started.forEach(sid => { if (!SONG[sid]) return; ROUTES.forEach(r => { const it = state.items[itemId(sid, r.id)]; if (it) out.push(it); }); });
  return out;
}
function checkLevel(it){ return Math.max(0, it.level - 1); }
function isDue(it, t){ return !!it.nextCheck && it.nextCheck <= t && it.lastCheck !== t; }
function needsWork(it){ return it.level > 0 || it.fails > 0 || !it.lastPractice; }
function log(e){ state.history.push(Object.assign({ id: rid(), ts: Date.now(), d: today() }, e)); }

function recordPractice(id, min){
  const it = state.items[id], t = today();
  it.lastPractice = t;
  if (!it.nextCheck || (it.nextCheck <= t && it.lastCheck !== t)) it.nextCheck = addDays(t, 1);
  it.t = Date.now();
  log({ k: 'practice', item: id, min, lvl: it.level });
}
function recordCheck(id, ok, auto){
  const it = state.items[id], t = today(), cl = checkLevel(it);
  const bars = auto && auto.bars && it.route !== 'impro' ? auto.bars : null;
  if (ok){
    it.fails = 0;
    if (it.level > 0) it.level = cl;
    if (cl === 0) it.streak += 1;
    it.nextCheck = it.level > 0 ? addDays(t, 1) : addDays(t, INTERVALS[Math.min(it.streak, INTERVALS.length) - 1]);
    it.hard = bars ? bars.slice() : [];
  } else {
    it.fails += 1; it.streak = 0;
    if (it.fails >= 2 && it.level < 2){ it.level += 1; it.fails = 0; }
    it.nextCheck = addDays(t, 1);
    if (bars) it.hard = Array.from(new Set(it.hard.concat(bars))).sort((a, b) => a - b);
  }
  it.lastCheck = t; it.t = Date.now();
  const e = { k: 'check', item: id, lvl: cl, ok: !!ok };
  if (auto) e.auto = { sug: !!auto.ok, err: auto.errors, stops: auto.stops };
  log(e);

/* Volgorde: wat het meest achterloopt eerst, en zo veel mogelijk afwisselen van route. De startroute schuift elke dag op. */
function routeRank(it){ return (ROUTE[it.route].i - dayDiff('2026-01-01', today()) % 3 + 3) % 3; }
function interleave(list){
  const rest = list.slice(), out = [];
  let last = null;
  while (rest.length){
    let k = rest.findIndex(x => x.route !== last);
    if (k < 0) k = 0;
    const x = rest.splice(k, 1)[0];
    out.push(x); last = x.route;
  }
  return out;
}
const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
function byCheck(a, b){ return cmpStr(a.nextCheck || '', b.nextCheck || '') || routeRank(a) - routeRank(b); }
function byPractice(a, b){
  return ((b.fails > 0) - (a.fails > 0)) || ((!b.lastPractice) - (!a.lastPractice)) || cmpStr(a.lastPractice || '', b.lastPractice || '') || (b.level - a.level) || routeRank(a) - routeRank(b);
}
function blockLen(minutes){ return minutes <= 10 ? 3 : 4; }
function buildPlan(minutes, exclude){
  exclude = exclude || new Set();
  const t = today(), items = songItems(), bl = blockLen(minutes);
  const due = interleave(items.filter(it => isDue(it, t)).sort(byCheck));
  const capMin = Math.max(CHECK_MIN, Math.floor(minutes * CHECK_SHARE));
  const checks = [];
  let used = 0;
  due.forEach(it => { if (used + CHECK_MIN <= capMin){ checks.push(it); used += CHECK_MIN; } });
  let planned = new Set(checks.map(it => it.id));
  let skippedDue = new Set(due.filter(it => !planned.has(it.id)).map(it => it.id));
  const practice = [];
  const fill = (list, maint) => {
    for (const it of list){
      const rem = minutes - used;
      if (rem < 2) break;
      const m = rem >= bl ? bl : rem;
      practice.push({ kind: 'practice', id: it.id, min: m, maint: !!maint });
      used += m;
    }
  };
  const work = items.filter(it => !skippedDue.has(it.id) && needsWork(it)).sort(byPractice);
  const order = interleave(work.filter(it => !exclude.has(it.id))).concat(interleave(work.filter(it => exclude.has(it.id))));
  fill(order, false);
  for (let round = 1; round < 3 && order.length >= 2 && minutes - used >= 2; round++) fill(order, false);
  if (minutes - used >= 2){
    const maint = items.filter(it => !skippedDue.has(it.id) && !needsWork(it) && !planned.has(it.id)).sort((a, b) => cmpStr(a.nextCheck || '', b.nextCheck || '') || routeRank(a) - routeRank(b));
    fill(interleave(maint), true);
  }
  // Tijd over en nog toetsen open: dan alsnog toetsen, vóór het oefenen.
  due.forEach(it => { if (!planned.has(it.id) && used + CHECK_MIN <= minutes){ checks.push(it); planned.add(it.id); used += CHECK_MIN; } });
  const blocks = checks.map(it => ({ kind: 'check', id: it.id, min: CHECK_MIN })).concat(practice);
  return { blocks, used, minutes };
}
function nextSongReady(){
  const started = BUILTIN.filter(s => state.started.includes(s.id));
  const last = started[started.length - 1];
  if (!last) return null;
  const nxt = BUILTIN[BUILTIN.indexOf(last) + 1];
  if (!nxt || state.started.includes(nxt.id)) return null;
  return ROUTES.every(r => { const it = state.items[itemId(last.id, r.id)]; return it && it.level <= 1; }) ? nxt : null;

function recommendedSong(){ return BUILTIN.find(s => !state.started.includes(s.id)) || null; }

/* ---------- Geluid ---------- */
let AC = null, master = null;
function audio(){

  }

}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(m, t, dur, vol, bus){

}

  o.type = 'square'; o.frequency.value = accent ? 1760 : 1180;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(accent ? 0.16 : 0.09, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);

function keyNote(m){ const c = audio(); if (c) tone(m, c.currentTime + 0.01, 0.35, 0.16, master); }

/* Planner in kwartnoten: tikken op de tel en gebeurtenissen op elk moment, ook achtsten. */
const T = { playing: false, timer: null, o: null, bus: null, timeouts: [], start: 0, spq: 1, qpc: 1, ci: 0, len: 4, ev: [], ei: 0, cyc: 0, k: 0, done: false, perf0: 0 };
function tStart(o){
  tStop();

  T.o = o; T.qpc = o.beat || 1; T.spq = 60 / o.bpm / T.qpc;
  T.ci = (o.countIn || 0) * T.qpc; T.len = o.len || 4;
  T.ev = (o.events || []).slice().sort((a, b) => a.beat - b.beat);
  T.ei = 0; T.cyc = 0; T.k = 0; T.done = false;
  T.bus = c.createGain(); T.bus.connect(master);

function later(t, fn){ T.timeouts.push(setTimeout(fn, Math.max(0, (t - AC.currentTime) * 1000))); }

    const q = T.k * T.qpc;
    if (qTime(q) >= horizon || (!o.loop && q >= end - 1e-9)) break;
    if (q < T.ci - 1e-9){
      const n = Math.round((T.ci - q) / T.qpc);
      click(qTime(q), T.k === 0, T.bus);
      later(qTime(q), () => { if (o.onCount) o.onCount(n); });
    } else if (o.click){
      const sq = (q - T.ci) % T.len;
      click(qTime(q), !!(o.accent && o.accent(sq)), T.bus);
    }
    T.k++;
  }
  while (T.ev.length){
    if (T.ei >= T.ev.length){ if (!o.loop) break; T.ei = 0; T.cyc++; }
    const e = T.ev[T.ei], q = T.ci + T.cyc * T.len + e.beat;
    if (qTime(q) >= horizon) break;
    e.fn(qTime(q), T.spq, T.bus);
    T.ei++;
  }
  if (!o.loop && !T.done && qTime(end) < horizon){
    T.done = true;
    later(qTime(end), () => { tStop(); if (o.onEnd) o.onEnd(); });
  }
}
function tStop(){
  T.playing = false; clearInterval(T.timer); T.timer = null;
  T.timeouts.forEach(clearTimeout); T.timeouts = [];
  if (T.bus && AC){
    const bus = T.bus;
    try { bus.gain.setTargetAtTime(0.0001, AC.currentTime, 0.02); } catch (e) { /* al gestopt */ }
    setTimeout(() => { try { bus.disconnect(); } catch (e) { /* al los */ } }, 250);
  }
  T.bus = null;
}
function barAccent(song){ const starts = song.bars.map(b => b.start); return q => starts.some(s => Math.abs(s - q) < 1e-6); }
function melodyEvents(song, from, to, onNote){
  return song.tl.notes.filter(n => !n.tie && n.beat >= from - 1e-6 && n.beat < to - 1e-6).map(n => ({ beat: n.beat - from, fn: (t, spq, bus) => {
    const d = n.sound * spq * 0.92;
    tone(n.midi, t, d, 0.22, bus);
    if (onNote){ later(t, () => onNote(n, true)); later(t + d, () => onNote(n, false)); }
  } }));
}
function rootEvents(song){ return song.tl.chords.map(c => ({ beat: c.beat, fn: (t, spq, bus) => tone(lhRoot(song, c.sym), t, c.dur * spq * 0.95, 0.15, bus) })); }
function backingEvents(song, onChord){
  return song.tl.chords.map(c => ({ beat: c.beat, fn: (t, spq, bus) => {
    const d = c.dur * spq * 0.97;
    voicing(c.sym).forEach(m => tone(m, t, d, 0.075, bus));
    tone(bassNote(c.sym), t, d, 0.12, bus);
    if (onChord) later(t, () => onChord(c));
  } }));
}

/* ---------- MIDI: een digitale piano laten meeluisteren ---------- */
const midi = { supported: typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function', status: 'off', access: null, names: [], held: new Map(), pedal: false, sustained: new Set() };
function midiLabel(){
  if (midi.status === 'on') return midi.names.length ? 'Piano: ' + midi.names[0] : 'Piano verbonden';
  if (midi.status === 'asking') return 'Piano verbinden…';
  if (midi.status === 'blocked') return 'MIDI geblokkeerd';
  if (midi.status === 'none') return 'Geen piano gevonden';
  if (midi.status === 'error') return 'MIDI werkt niet';
  return 'Piano verbinden';
}
function bindMidiInputs(){
  if (!midi.access) return;
  midi.names = [];
  midi.access.inputs.forEach(inp => {
    inp.onmidimessage = onMidiMessage;
    if (inp.state !== 'disconnected') midi.names.push(inp.name || 'MIDI');
  });
  midi.status = midi.names.length ? 'on' : 'none';
}
async function midiConnect(){
  if (!midi.supported || midi.status === 'asking') return;
  midi.status = 'asking'; renderMidiBits();
  try {
    const acc = await navigator.requestMIDIAccess({ sysex: false });
    midi.access = acc;
    acc.onstatechange = () => { bindMidiInputs(); renderMidiBits(); };
    bindMidiInputs();
    dev.midiAuto = true; saveDev();
  } catch (e) {
    midi.status = e && (e.name === 'SecurityError' || e.name === 'NotAllowedError') ? 'blocked' : 'error';
  }
  renderMidiBits();
}
async function midiAutoConnect(){
  if (!midi.supported || !dev.midiAuto || !navigator.permissions) return;
  try { const p = await navigator.permissions.query({ name: 'midi' }); if (p.state === 'granted') midiConnect(); } catch (e) { /* onbekende toestemming: wachten op een tik */ }
}
function onMidiMessage(ev){
  const d = ev.data;
  if (!d || d.length < 2) return;
  const cmd = d[0] & 0xf0, ts = (ev.timeStamp || performance.now()) / 1000;
  if (cmd === 0x90 && d[2] > 0) midiNote(d[1], true, ts);
  else if (cmd === 0x80 || (cmd === 0x90 && d[2] === 0)) midiNote(d[1], false, ts);
  else if (cmd === 0xB0 && d[1] === 64) midiPedal(d[2] >= 64, ts);
}
function midiNote(m, on, ts){
  if (on){ midi.held.set(m, ts); midi.sustained.delete(m); } else midi.held.delete(m);
  kbMark(m, 'press', on);
  if (on) onPlayed(m, ts);
  else if (midi.pedal) midi.sustained.add(m);
  else onReleased(m, ts);
}
// Met het sustainpedaal klinkt een losgelaten toets door tot het pedaal omhoog gaat.
function midiPedal(down, ts){
  midi.pedal = down;
  if (!down){ midi.sustained.forEach(m => onReleased(m, ts)); midi.sustained.clear(); }
}
function renderMidiBits(){
  const chip = document.getElementById('pchip');
  if (chip){ chip.dataset.s = midi.status; chip.lastChild.textContent = midiLabel(); }
  const card = document.getElementById('midicard');
  if (card) card.outerHTML = midiCardHTML();
  const ctl = document.getElementById('midictl');
  if (ctl) ctl.outerHTML = midiCtlHTML();
  if (midi.status === 'on' && isBusy()){ const c = cur(); if (c) startListening(c); }
}

/* Vergelijken: wat je speelde tegenover wat er staat (bewerkingsafstand), met de fouten per maat. */
function needMatch(nd, m){ return m % 12 === nd.pc && (nd.lh ? m < 60 : Math.abs(m - nd.midi) <= 12); }
function expectedSeq(song, route, from, to){
  const seq = [];
  const lo = from || 0, hi = to == null ? Infinity : to;
  song.tl.notes.forEach(n => {
    if (n.tie || n.beat < lo - 1e-6 || n.beat >= hi - 1e-6) return;
    if (route === 'akkoord'){
      const ch = song.tl.chords.find(c => Math.abs(c.beat - n.beat) < 1e-6);
      if (ch){ const r = lhRoot(song, ch.sym); seq.push({ pc: r % 12, midi: r, lh: true, bar: n.bar, beat: n.beat, idx: n.idx }); }
    }
    seq.push({ pc: n.midi % 12, midi: n.midi, bar: n.bar, beat: n.beat, idx: n.idx });
  });
  return seq;
}
function alignSeq(exp, played){
  const n = exp.length, k = played.length;
  const D = [];
  for (let i = 0; i <= n; i++){ D.push(new Int32Array(k + 1)); D[i][0] = i; }
  for (let j = 0; j <= k; j++) D[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= k; j++){
    const sub = D[i - 1][j - 1] + (needMatch(exp[i - 1], played[j - 1].m) ? 0 : 1);
    D[i][j] = Math.min(sub, D[i - 1][j] + 1, D[i][j - 1] + 1);
  }
  const errs = {}, pairs = [];
  const add = b => { errs[b] = (errs[b] || 0) + 1; };
  let i = n, j = k;
  while (i > 0 || j > 0){
    if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + (needMatch(exp[i - 1], played[j - 1].m) ? 0 : 1)){
      if (needMatch(exp[i - 1], played[j - 1].m)) pairs.push([i - 1, j - 1]); else add(exp[i - 1].bar);
      i--; j--;
    } else if (i > 0 && D[i][j] === D[i - 1][j] + 1){ add(exp[i - 1].bar); i--; }
    else { add(exp[Math.max(0, i - 1)] ? exp[Math.max(0, i - 1)].bar : 0); j--; }
  }
  pairs.reverse();
  let reach = 0;
  for (let ii = 0; ii <= n; ii++) if (D[ii][k] <= D[reach][k]) reach = ii;
  return { cost: D[n][k], errs, pairs, reach };
}
function countStops(exp, played, pairs){
  const gaps = [];
  for (let j = 1; j < played.length; j++) gaps.push(played[j].t - played[j - 1].t);
  const ratio = [];
  for (let p = 1; p < pairs.length; p++){
    const a = pairs[p - 1], b = pairs[p], db = exp[b[0]].beat - exp[a[0]].beat, dt = played[b[1]].t - played[a[1]].t;
    if (db > 0.2 && dt > 0) ratio.push(dt / db);
  }
  const spq = median(ratio), g = median(gaps.filter(x => x > GROUP_SEC));
  const at = new Map(pairs.map(p => [p[1], p[0]]));
  let stops = 0;
  for (let j = 1; j < played.length; j++){
    const dt = played[j].t - played[j - 1].t;
    const ea = at.get(j - 1), eb = at.get(j);
    let limit;
    if (spq && ea != null && eb != null) limit = Math.max(STOP_MIN_SEC, (exp[eb].beat - exp[ea].beat) * spq * STOP_FACTOR);
    else limit = Math.max(STOP_MIN_SEC, (g || 0.6) * 3);
    if (dt > limit) stops++;
  }
  return stops;
}
function judgePlay(exp, played){
  const a = alignSeq(exp, played);
  const stops = countStops(exp, played, a.pairs);
  const bars = Object.keys(a.errs).map(Number).sort((x, y) => x - y).map(b => b + 1);
  return { errors: a.cost, stops, bars, ok: a.cost <= 1 && stops === 0 && played.length > 0 };
}
function judgeImpro(song, notes, offs, t0, spq){
  const offAfter = n => { const o = offs.find(x => x.m === n.m && x.t > n.t); return o ? o.t : Infinity; };
  let stops = 0;
  const silentBars = [];
  song.bars.forEach((b, i) => {
    if (!chordAt(song, b.start + b.len - 1e-3)) return;
    const s = t0 + b.start * spq, e = t0 + (b.start + b.len) * spq;
    const sounding = notes.some(n => (n.t >= s - 0.15 && n.t < e) || (n.t < s && offAfter(n) > s + 0.1));
    if (!sounding){ stops++; silentBars.push(i + 1); }
  });
  const lastNote = notes.length ? notes[notes.length - 1] : null;
  const endsTonic = !!lastNote && lastNote.m % 12 === song.tonic;
  return { stops, bars: silentBars, endsTonic, ok: stops === 0 && endsTonic && notes.length > 0, errors: 0, count: notes.length };
}

/* Meespelen tijdens oefenen, opnemen tijdens een toets, naspelen op gehoor */
const fol = { steps: [], i: 0, got: new Set(), errs: {}, runs: 0, msg: '', key: '' };
const rec = { on: false, notes: [], offs: [], result: null, timer: null, key: '' };
const echo = { chunk: 0, listen: false, notes: [], timer: null, msg: '' };
function folSteps(song, route){
  const steps = [];
  expectedSeq(song, route).forEach(e => {
    const last = steps[steps.length - 1];
    if (last && last.beat === e.beat && last.need.some(x => x.lh) && !last.need.some(x => !x.lh)) last.need.push(e);
    else steps.push({ beat: e.beat, bar: e.bar, idx: e.idx, need: [e] });
  });
  return steps;
}
function startListening(c){
  if (midi.status !== 'on' || !c) return;
  const key = session.i + ':' + c.b.id + ':' + c.b.kind;
  if (c.isCheck){
    if (rec.key !== key){ Object.assign(rec, { on: c.it.route !== 'impro', notes: [], offs: [], result: null, key }); clearTimeout(rec.timer); }
  } else if (c.it.route !== 'impro'){
    if (fol.key !== key){ Object.assign(fol, { steps: folSteps(c.song, c.it.route), i: 0, got: new Set(), errs: {}, runs: 0, msg: '', key }); }
  }
  showLive();
  showCursor();
}
function onPlayed(m, ts){
  const c = cur();
  if (!c){
    // Op Vandaag kies je de tijd ook op de piano: C, D, E, F, G of A rond de middelste C.
    const k = TIME_NOTES.indexOf(m);
    if (k >= 0 && !session && !ui.edit && ui.tab === 'vandaag' && state.started.length && ui.minutes !== TIME_OPTIONS[k]){ ui.minutes = TIME_OPTIONS[k]; render(); }
    return;
  }
  if (c.isCheck){
    if (c.it.route === 'impro'){ if (rec.on) rec.notes.push({ m, t: ts }); return; }
    if (!rec.on || rec.result) return;
    const n = { m, t: ts }, arr = rec.notes;
    let k = arr.length;
    while (k > 0 && ts - arr[k - 1].t < GROUP_SEC && arr[k - 1].m > m) k--;
    arr.splice(k, 0, n);
    clearTimeout(rec.timer);
    const exp = expectedSeq(c.song, c.it.route);
    const a = alignSeq(exp, arr);
    if (a.reach >= exp.length && needMatch(exp[exp.length - 1], arr[arr.length - 1].m)) rec.timer = setTimeout(finishRec, 900);
    else rec.timer = setTimeout(() => { if (arr.length >= Math.max(3, exp.length * 0.5)) finishRec(); }, 4000);
    showLive();
    return;
  }
  if (c.it.route === 'impro'){ if (echo.listen){ echo.notes.push({ m, t: ts }); clearTimeout(echo.timer); echo.timer = setTimeout(finishEcho, 2200); } return; }
  folPress(c, m);
}
function onReleased(m, ts){ if (rec.on) rec.offs.push({ m, t: ts }); }
function folPress(c, m){
  if (!fol.steps.length) return;
  const st = fol.steps[fol.i];
  const k = st.need.findIndex((nd, j) => !fol.got.has(j) && needMatch(nd, m));
  if (k >= 0){
    fol.got.add(k);
    if (fol.got.size === st.need.length) folAdvance(c);
    else showCursor();
    return;
  }
  const nx = fol.steps[fol.i + 1];
  const melodyDone = st.need.every((nd, j) => nd.lh || fol.got.has(j));
  if (melodyDone && nx && nx.need.some(nd => needMatch(nd, m))){
    fol.errs[st.bar] = (fol.errs[st.bar] || 0) + 1;
    folAdvance(c);
    folPress(c, m);
    return;
  }
  fol.errs[st.bar] = (fol.errs[st.bar] || 0) + 1;
  fol.msg = c.lvl >= 1 ? 'Niet goed. Zoek ' + listNL(st.need.filter((nd, j) => !fol.got.has(j)).map(nd => (nd.lh ? 'links ' : '') + noteLabel(c.song, nd.midi))) + '.' : 'Niet goed. Probeer het nog eens.';
  flashWrong(m);
  showLive();
}
function folAdvance(c){
  fol.i++; fol.got = new Set(); fol.msg = '';
  if (fol.i >= fol.steps.length){
    const bars = Object.keys(fol.errs).map(Number).sort((a, b) => a - b);
    const total = bars.reduce((s, b) => s + fol.errs[b], 0);
    fol.runs++;
    if (bars.length){
      const set = new Set(c.it.hard);
      bars.forEach(b => set.add(b + 1));
      c.it.hard = Array.from(set).sort((a, b) => a - b); c.it.t = Date.now();
      persist();
      document.querySelectorAll('.chip[data-act="hard"]').forEach(el => el.setAttribute('aria-pressed', c.it.hard.includes(+el.dataset.bar)));
      markHard();
    }
    fol.msg = total ? 'Doorgespeeld met ' + plural(total, 'fout', 'fouten') + ', in ' + listNL(bars.map(b => 'maat ' + (b + 1))) + '. Die maten staan nu bij de lastige maten.' : 'Helemaal goed doorgespeeld. Nog een keer? Begin gewoon opnieuw.';
    fol.i = 0; fol.errs = {};
  }
  showLive();
  showCursor();
}
function finishRec(){
  clearTimeout(rec.timer);
  const c = cur();
  if (!c || !rec.on) return;
  rec.result = judgePlay(expectedSeq(c.song, c.it.route), rec.notes);
  showLive();
  suggestVerdict();
}
function resetRec(){ clearTimeout(rec.timer); rec.notes = []; rec.offs = []; rec.result = null; showLive(); suggestVerdict(); }
function finishEcho(){
  clearTimeout(echo.timer);
  echo.listen = false;
  const c = cur();
  if (!c) return;
  const r = echoRange(c.song);
  const exp = expectedSeq(c.song, 'noten', r.from, r.to);
  const a = alignSeq(exp, echo.notes);
  const good = a.pairs.length;
  echo.msg = good === exp.length && a.cost === 0 ? 'Precies goed nagespeeld.' : good + ' van de ' + exp.length + ' noten goed. Luister nog eens en probeer opnieuw.';
  setStatus(echo.msg);
}
function suggestVerdict(){
  const ok = document.querySelector('[data-act="checkok"]'), bad = document.querySelector('[data-act="checkbad"]');
  if (!ok || !bad) return;
  ok.classList.toggle('suggest', !!(rec.result && rec.result.ok));
  bad.classList.toggle('suggest', !!(rec.result && !rec.result.ok));
}
function liveHTML(c){
  if (midi.status !== 'on' || !c) return '';
  if (c.isCheck){
    if (c.it.route === 'impro'){
      const r = rec.result;
      if (r) return '<div class="live" id="live"><p><b>Voorstel: ' + (r.ok ? 'gehaald' : 'niet gehaald') + '.</b> ' + (r.stops ? 'Stil in ' + listNL(r.bars.map(b => 'maat ' + b)) + '. ' : 'Je bent niet gestopt. ') + (r.endsTonic ? 'Je eindigde op ' + pcName(c.song.tonic, c.song.key) + '.' : 'Je eindigde niet op ' + pcName(c.song.tonic, c.song.key) + '.') + ' Jij beslist.</p></div>';
      return '<div class="live" id="live"><p><b>De piano luistert mee.</b> Start de begeleiding; na de laatste maat doet de app een voorstel.</p></div>';
    }
    const r = rec.result;
    if (r){
      const parts = [];
      parts.push(r.errors ? plural(r.errors, 'fout', 'fouten') + (r.bars.length ? ', in ' + listNL(r.bars.map(b => 'maat ' + b)) : '') : 'geen fouten');
      parts.push(r.stops ? plural(r.stops, 'keer gestopt', 'keer gestopt') : 'niet gestopt');
      return '<div class="live" id="live"><p><b>Voorstel: ' + (r.ok ? 'gehaald' : 'niet gehaald') + '.</b> ' + cap(parts.join(', ')) + '. Jij beslist.</p><div class="btnrow"><button class="btn ghost" data-act="recreset">Meting wissen</button></div></div>';
    }
    return '<div class="live" id="live"><p><b>De piano luistert mee.</b> ' + (rec.notes.length ? plural(rec.notes.length, 'noot', 'noten') + ' gehoord.' : 'Begin wanneer je wilt; de meting start bij je eerste noot.') + '</p>' + (rec.notes.length ? '<div class="btnrow"><button class="btn ghost" data-act="recdone">Klaar met spelen</button><button class="btn ghost" data-act="recreset">Opnieuw beginnen</button></div>' : '') + '</div>';
  }
  if (c.it.route === 'impro') return '';
  const st = fol.steps[fol.i];
  const where = st ? 'maat ' + (st.bar + 1) : '';
  return '<div class="live" id="live"><p><b>Speel mee, de app volgt je.</b> ' + (fol.msg ? esc(fol.msg) : (c.lvl >= 1 ? 'Je bent bij ' + where + '.' : 'Fouten zie je aan het eind.')) + '</p></div>';
}
function showLive(){ const el = document.getElementById('live'), c = cur(); if (el) el.outerHTML = liveHTML(c) || '<div id="live"></div>'; }
function showCursor(){
  const el = document.getElementById('score'), c = cur();
  if (!el || !c) return;
  el.querySelectorAll('.cur').forEach(n => n.classList.remove('cur'));
  if (c.isCheck || c.lvl < 1 || midi.status !== 'on' || !fol.steps.length) return;
  const st = fol.steps[fol.i];
  if (st) el.querySelectorAll('.abcjs-mm' + st.bar + '.abcjs-n' + st.idx).forEach(n => n.classList.add('cur'));
}
function flashWrong(m){
  kbMark(m, 'bad', true);
  setTimeout(() => kbMark(m, 'bad', false), 450);
}
function echoRange(song){
  const n = song.bars.length, chunk = 2, k = echo.chunk % Math.max(1, Math.ceil(n / chunk));
  const b0 = k * chunk, b1 = Math.min(n, b0 + chunk);
  return { from: song.bars[b0].start, to: b1 < n ? song.bars[b1].start : song.tl.length, b0, b1 };
}

/* ---------- Scherm aan houden tijdens een sessie ---------- */
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
function releaseWake(){ try { if (wake) wake.release(); } catch (e) { /* niets */ } wake = null; }

/* ---------- Weergave ---------- */
const app = document.getElementById('app');
const ui = { tab: 'vandaag', minutes: null, metro: false, selBar: 0, edit: null, ioMsg: '', ioOpen: false };
let session = null, mode = null, timerInt = null, lvlNow = 0, scorePer = 0, abcState = 'loading';
const MARK = '<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>';

function isBusy(){ return !!session && !session.done; }
function cur(){
  if (!isBusy()) return null;
  const b = session.blocks[session.i], it = b && state.items[b.id];
  if (!it || !SONG[it.song]) return null;
  const isCheck = b.kind === 'check';
  return { b, it, song: SONG[it.song], isCheck, lvl: isCheck ? checkLevel(it) : it.level };
}

function render(){
  tStop(); mode = null; clearInterval(timerInt); timerInt = null;
  if (isBusy() && !cur()){ session = null; }
  const busy = isBusy();
  document.body.classList.toggle('in-session', !!session);
  let main;
  if (session && session.done) main = summaryHTML();
  else if (busy) main = blockHTML();
  else main = (VIEWS[ui.tab] || vandaagHTML)();
  app.innerHTML = '<div class="wrap">' + headerHTML() + '<main id="main">' + main + '</main></div>' + (session ? '' : navHTML());
  if (busy) afterBlock();
  if (!busy && ui.tab === 'liedjes' && ui.edit) afterEditor();
}
function pchipHTML(){ return midi.supported ? '<button class="pchip" id="pchip" data-act="midi" data-s="' + midi.status + '"><i aria-hidden="true"></i><span>' + esc(midiLabel()) + '</span></button>' : ''; }
function headerHTML(){
  const right = isBusy() ? '<button class="link" data-act="stop">Sessie stoppen</button>' : '<span class="sync" id="sync">' + syncText() + '</span>' + pchipHTML();
  return '<header class="top"><p class="brand">' + MARK + 'Drie routes</p><div class="hright">' + right + '</div></header>';
}
function navHTML(){
  const tabs = [['vandaag', 'Vandaag'], ['liedjes', 'Liedjes'], ['voortgang', 'Voortgang'], ['uitleg', 'Uitleg']];
  return '<nav class="tabs" aria-label="Hoofdmenu"><div class="in">' + tabs.map(x => '<button data-act="tab" data-tab="' + x[0] + '"' + (ui.tab === x[0] ? ' aria-current="page"' : '') + '>' + x[1] + '</button>').join('') + '</div></nav>';

function midiCardHTML(){

function drawAbc(el, song, o){

    try {
      window.ABCJS.renderAbc(el, abcFor(song, o), { responsive: 'resize', add_classes: true, staffwidth: o.perLine === 2 ? 330 : 660, paddingtop: 6, paddingbottom: 2, paddingleft: 4, paddingright: 4 });

function markHard(){
  const el = document.getElementById('score'), c = cur();
  if (!el || !c) return;
  el.querySelectorAll('.hard').forEach(n => n.classList.remove('hard'));
  c.it.hard.forEach(n => el.querySelectorAll('.abcjs-note.abcjs-mm' + (n - 1)).forEach(x => x.classList.add('hard')));

function renderKb(c, sym){
  const el = document.getElementById('kb');
  if (!el || !c) return;
  const song = c.song, marks = new Map();
  let lo = song.lo, hi = song.hi, legend;
  if (c.it.route === 'noten'){
    song.rh.forEach(m => marks.set(m, { cls: 'rh', label: noteLabel(song, m) }));
    legend = ['rh'];
  } else if (c.it.route === 'akkoord'){
    song.rh.forEach(m => marks.set(m, { cls: 'rh', label: noteLabel(song, m) }));
    song.chordSyms.forEach(s => { const r = lhRoot(song, s); marks.set(r, { cls: 'lh', label: pcName(r % 12, song.key) }); lo = Math.min(lo, r); hi = Math.max(hi, r); });
    legend = ['rh', 'lh'];
  } else {
    sym = sym || barChords(song, ui.selBar || 0)[0] || song.chordSyms[0];
    if (!sym) return;
    const safe = safeNotes(song, sym), r = lhRoot(song, sym);
    safe.forEach(m => marks.set(m, { cls: 'rh', label: noteLabel(song, m) }));
    marks.set(r, { cls: 'lh', label: pcName(r % 12, song.key) });
    lo = Math.min(lo, r);
    legend = ['safe', 'root'];
    const st = document.getElementById('safeTxt');
    if (st){
      const syms = barChords(song, ui.selBar || 0);
      st.textContent = (syms.length > 1 && mode !== 'backing' ? syms.map(s => 'Bij ' + s + ' klinken ' + listNL(uniqNames(song, safeNotes(song, s))) + ' veilig.').join(' ') : 'Bij ' + sym + ' klinken ' + listNL(uniqNames(song, safe)) + ' veilig.') + ' De begeleiding speelt de grondtoon.';
    }
  }
  if (midi.status === 'on') legend.push('press');
  // Minstens een octaaf, beginnend op een C of F en eindigend op een witte toets.
  if (hi - lo < 12) hi = lo + 12;
  while (lo % 12 !== 0 && lo % 12 !== 5) lo--;
  while (!WHITE.includes(hi % 12)) hi++;
  el.innerHTML = keyboardSVG(marks, lo, hi, el.clientWidth || 340) + legendHTML(legend, lo <= 60 && hi >= 60);
  midi.held.forEach((t, m) => kbMark(m, 'press', true));
}
function legendHTML(keys, midC){
  const L = { rh: ['rh', 'Rechterhand'], lh: ['lh', 'Linkerhand'], safe: ['rh', 'Veilige noten'], root: ['lh', 'Grondtoon'], press: ['press', 'Wat je speelt'] };
  return '<div class="kblegend">' + keys.map(k => '<span><i class="sw ' + L[k][0] + '"></i>' + L[k][1] + '</span>').join('') + (midC ? '<span><i class="sw mc"></i>Midden-C</span>' : '') + '</div>';
}
function keyboardSVG(marks, lo, hi, px){
  const W = 28, H = 104, BW = 17, BH = 64, whites = [], labels = [];
  for (let m = lo; m <= hi; m++) if (WHITE.includes(m % 12)) whites.push(m);
  marks.forEach(v => labels.push(v.label));
  // Bij een breed bereik schaalt het toetsenbord klein; houd de letters dan toch leesbaar.
  const k = (whites.length * W) / Math.max(200, px), fs = Math.max(12, Math.round(11 * k)), bfs = Math.max(9, Math.round(9 * k));
  let s = '<svg class="kb" viewBox="0 0 ' + (whites.length * W + 1) + ' ' + (H + 1) + '" role="img" aria-label="Toetsenbord, gemarkeerd: ' + esc(listNL(labels)) + '" style="--fs:' + fs + 'px;--bfs:' + bfs + 'px">';
  whites.forEach((m, i) => {
    const mk = marks.get(m), x = i * W + 0.5;
    s += '<g class="k ' + (mk ? mk.cls : '') + '" data-m="' + m + '"><rect class="w" x="' + x + '" y="0.5" width="' + W + '" height="' + H + '" rx="3"/>';
    if (m === 60) s += '<circle class="mc" cx="' + (x + W / 2) + '" cy="' + (H - 30) + '" r="2.6"/>';
    if (mk && mk.label) s += '<text x="' + (x + W / 2) + '" y="' + (H - 10) + '">' + esc(mk.label) + '</text>';
    s += '</g>';
  });
  for (let m = lo; m <= hi; m++){
    if (WHITE.includes(m % 12)) continue;
    const i = whites.indexOf(m - 1);
    if (i < 0) continue;
    const mk = marks.get(m), x = (i + 1) * W + 0.5 - BW / 2;
    s += '<g class="k ' + (mk ? mk.cls : '') + '" data-m="' + m + '"><rect class="b" x="' + x + '" y="0.5" width="' + BW + '" height="' + BH + '" rx="2"/>';
    if (mk && mk.label) s += '<text class="bk" x="' + (x + BW / 2) + '" y="' + (BH - 7) + '">' + esc(mk.label) + '</text>';
    s += '</g>';
  }
  return s + '</svg>';
}
function kbMark(m, cls, on){ const g = document.querySelector('#kb g[data-m="' + m + '"]'); if (g) g.classList.toggle(cls, on); }
function clearKeys(){
  document.querySelectorAll('#kb g.on').forEach(g => g.classList.remove('on'));
  document.querySelectorAll('#chart .cur').forEach(x => x.classList.remove('cur'));
}
function setStatus(t){ const el = document.getElementById('status'); if (el) el.textContent = t; }
function startTimer(b){
  clearInterval(timerInt);
  const el = document.getElementById('timer');
  if (!el) return;
  let chimed = false;
  const tick = () => {
    const left = Math.round(b.min * 60 - (Date.now() - session.blockStart) / 1000);
    if (left >= 0){ el.textContent = fmt(left); el.classList.remove('up'); }
    else { el.textContent = '+' + fmt(-left); el.classList.add('up'); }
    if (left <= 0 && !chimed){ chimed = true; chime(); setStatus('Tijd om te wisselen. Rond af en tik op Klaar.'); }
  };
  tick();
  timerInt = setInterval(tick, 500);
}

/* Afspelen */
function updateButtons(){
  const l = document.getElementById('listenBtn');
  if (l){ l.setAttribute('aria-pressed', mode === 'listen'); l.textContent = mode === 'listen' ? 'Stop' : 'Luister'; }
  const bk = document.getElementById('backBtn');
  if (bk){ bk.setAttribute('aria-pressed', mode === 'backing'); bk.textContent = mode === 'backing' ? 'Stop begeleiding' : 'Begeleiding'; }
  const mt = document.getElementById('metroBtn');
  if (mt) mt.setAttribute('aria-pressed', ui.metro);
}
function startMode(m){
  const c = cur();
  if (!c) return;
  const song = c.song, bpm = c.it.bpm, mi = song.mi, countIn = Math.round(mi.barLen / mi.beat);
  const onCount = n => setStatus('Aftellen: ' + n);
  const end = () => { mode = null; clearKeys(); setStatus(''); if (ui.metro) startMode('metro'); else updateButtons(); };
  const base = { bpm, beat: mi.beat, click: ui.metro, accent: barAccent(song) };
  let ok = false;
  if (m === 'metro') ok = tStart({ bpm, beat: mi.beat, len: mi.barLen, loop: true, click: true, accent: q => q < 1e-6 });
  else if (m === 'listen'){
    const ev = melodyEvents(song, 0, Infinity, (n, on) => { kbMark(n.midi, 'on', on); if (on) setStatus('Maat ' + (n.bar + 1)); });
    ok = tStart(Object.assign({}, base, { len: song.tl.length, countIn, onCount, onEnd: end, events: c.it.route === 'akkoord' ? ev.concat(rootEvents(song)) : ev }));
  } else if (m === 'backing'){
    const once = c.isCheck;
    if (once && midi.status === 'on'){ rec.on = true; rec.notes = []; rec.offs = []; rec.result = null; showLive(); suggestVerdict(); }
    ok = tStart(Object.assign({}, base, { len: song.tl.length, loop: !once, countIn, onCount,
      onEnd: () => {
        if (once && rec.on && midi.status === 'on'){
          rec.result = judgeImpro(song, rec.notes, rec.offs, songStartPerf(), T.spq);
          rec.on = false; showLive(); suggestVerdict();
        }
        end();
      },
      events: backingEvents(song, ch => {
        setStatus('Maat ' + (ch.bar + 1) + ': ' + ch.sym);
        document.querySelectorAll('#chart button').forEach((x, i) => x.classList.toggle('cur', i === ch.bar));
        if (lvlNow === 2) renderKb(cur(), ch.sym);
      }) }));
  } else if (m === 'echo'){
    const r = echoRange(song);
    echo.listen = false; echo.notes = [];
    ok = tStart(Object.assign({}, base, { click: false, len: r.to - r.from, countIn, onCount,
      events: melodyEvents(song, r.from, r.to, (n, on) => kbMark(n.midi, 'on', on)),
      onEnd: () => {
        mode = null; clearKeys(); updateButtons();
        if (midi.status === 'on'){ echo.listen = true; setStatus('Speel het nu na.'); echo.timer = setTimeout(() => { if (echo.listen && !echo.notes.length){ echo.listen = false; setStatus(''); } }, 8000); }
        else setStatus('Speel het nu na.');
      } }));
  }
  mode = ok ? m : null;
  if (!ok) setStatus('Geluid werkt niet in deze browser.');
  else if (m === 'metro') setStatus('Metronoom op ' + bpm + ' bpm.');
  updateButtons();
}
function stopAudio(){ tStop(); mode = null; clearKeys(); setStatus(''); updateButtons(); }

/* Samenvatting */
function summaryHTML(){
  const r = session.results, checks = r.filter(x => x.kind === 'check'), okN = checks.filter(x => x.ok).length, prac = r.filter(x => x.kind === 'practice');
  const mins = r.reduce((s, x) => s + (x.min || 0), 0);
  const tm = addDays(today(), 1), dueTm = songItems().filter(it => it.nextCheck && it.nextCheck <= tm).length;
  return '<h2>Sessie klaar</h2><dl class="sum">' +
    '<dt>Toetsen</dt><dd>' + (checks.length ? okN + ' van ' + checks.length + ' gehaald' : 'geen') + '</dd>' +
    '<dt>Oefenblokken</dt><dd>' + prac.length + '</dd>' +
    '<dt>Tijd, ongeveer</dt><dd>' + mins + ' min</dd>' +
    '<dt>Morgen klaar</dt><dd>' + dueTm + (dueTm === 1 ? ' toets' : ' toetsen') + '</dd></dl>' +
    '<p class="small muted" id="moreMsg">De toetsen van morgen laten zien wat er van vandaag is blijven hangen.</p>' +
    '<div class="btnrow"><button class="btn" data-act="more">Nog 5 minuten</button><button class="btn primary" data-act="finish">Terug naar vandaag</button></div>';
}

/* Liedjes */
function statusLine(it){
  let s = cap(HELP[it.level]);
  s += it.nextCheck ? ', volgende toets ' + relDay(it.nextCheck) : ', nog niet geoefend';
  if (it.streak) s += ', ' + it.streak + '× op rij zonder hulp gehaald';
  return s;
}
function songLI(s, rec){

function editorSong(){

function afterEditor(){
  const msg = document.getElementById('edmsg'), pv = document.getElementById('preview'), save = document.getElementById('edsave'), play = document.getElementById('edplay');

let edTimer = null;
function onEditorInput(el){
  if (!ui.edit) return;
  ui.edit[el.dataset.in] = el.value;
  if (el.dataset.in === 'abc' && /^\s*[A-Z]:/m.test(el.value)){
    try {
      const p = parseAbc(el.value, { meter: ui.edit.meter, key: ui.edit.key });
      const fm = document.getElementById('f-meter'), fk = document.getElementById('f-key'), ft = document.getElementById('f-title');
      if (fm && p.head.meter !== ui.edit.meter && Array.from(fm.options).some(o => o.value === p.head.meter)){ ui.edit.meter = p.head.meter; fm.value = p.head.meter; }
      if (fk && p.head.key !== ui.edit.key){ ui.edit.key = p.head.key; fk.value = p.head.key; }
      if (ft && !ui.edit.title.trim() && p.head.title){ ui.edit.title = p.head.title; ft.value = p.head.title; }
    } catch (e) { /* fout volgt in de controle */ }
  }
  clearTimeout(edTimer);
  edTimer = setTimeout(afterEditor, 250);
}
function editorPlay(){
  let song;
  try { song = editorSong(); } catch (e) { return; }
  if (mode === 'preview'){ stopAudio(); const b = document.getElementById('edplay'); if (b) b.textContent = 'Luister'; return; }
  const ok = tStart({ bpm: 72, beat: song.mi.beat, len: song.tl.length, countIn: Math.round(song.mi.barLen / song.mi.beat), click: false, accent: barAccent(song),
    events: melodyEvents(song, 0, Infinity).concat(backingEvents(song)), onEnd: () => { mode = null; const b = document.getElementById('edplay'); if (b) b.textContent = 'Luister'; } });
  mode = ok ? 'preview' : null;
  const b = document.getElementById('edplay');
  if (b && ok) b.textContent = 'Stop';
}
function editorSave(){
  const e = ui.edit;
  let song;
  try { song = editorSong(); } catch (er) { afterEditor(); return; }
  if (!e.title.trim()) return;
  const id = e.id || ('u-' + rid());
  const prev = customSrc[id] || {};
  customSrc[id] = { id, title: e.title.trim().slice(0, 80), meter: song.meter, key: song.key, abc: e.abc, created: prev.created || Date.now(), t: Date.now() };
  persistSongs();
  rebuildSongs();
  if (e.id) ROUTES.forEach(r => { const it = state.items[itemId(id, r.id)]; if (it){ it.hard = []; it.t = Date.now(); } });
  ui.edit = null; tStop(); mode = null;
  persist();
  render(); window.scrollTo(0, 0);
}
function deleteSong(id){
  const s = customSrc[id];
  if (!s) return;
  customSrc[id] = { id, deleted: true, t: Date.now() };
  persistSongs();
  state.started = state.started.filter(x => x !== id);
  ROUTES.forEach(r => { delete state.items[itemId(id, r.id)]; });
  rebuildSongs();
  persist(); render();
}

/* Voortgang */
function voortgangHTML(){
  const t = today(), f30 = addDays(t, -29), f7 = addDays(t, -6), ev = state.history;
  const routeOf = e => String(e.item).split(':')[1];
  let h = '<h2>Voortgang</h2><p class="muted small">De maatstaf is wat je een dag of langer later nog kunt, niet hoe het tijdens het oefenen voelt.</p>';
  if (cloud.err) h += '<p class="note-box small">Opslaan in je account lukte niet' + (cloud.err === 'quota_exceeded' ? ', de opslag is vol' : '') + '. Je voortgang staat wel op dit apparaat. Bewaar hem hieronder als bestand of kopie.</p>';
  if (!ev.length) h += '<p>Nog geen gegevens. Na je eerste sessie en de toets van de dag erna zie je hier wat er blijft hangen.</p>';

    const zero = checks.filter(e => e.lvl === 0), zeroOk = zero.filter(e => e.ok).length, allOk = checks.filter(e => e.ok).length;
    const min7 = ev.filter(e => e.d >= f7).reduce((s, e) => s + (e.k === 'check' ? CHECK_MIN : (e.min || 0)), 0);
    h += '<div class="metric"><b>' + (zero.length ? zeroOk + '/' + zero.length : '–') + '</b><span>toetsen zonder hulp gehaald, laatste 30 dagen</span></div>';
    h += '<div class="metric"><b>' + (checks.length ? allOk + '/' + checks.length : '–') + '</b><span>alle toetsen gehaald, laatste 30 dagen</span></div>';
    h += '<div class="metric"><b>' + min7 + '</b><span>minuten geoefend en getoetst, laatste 7 dagen</span></div>';
    const auto = checks.filter(e => e.auto);
    if (auto.length){ const same = auto.filter(e => e.auto.sug === e.ok).length; h += '<p class="small muted">Bij ' + plural(auto.length, 'toets', 'toetsen') + ' luisterde de piano mee; ' + same + ' keer koos je hetzelfde als het voorstel.</p>'; }

      const c = checks.filter(e => routeOf(e) === r.id), ok = c.filter(e => e.ok).length, pct = c.length ? Math.round(ok / c.length * 100) : 0;
      return '<div class="row r-' + r.id + '"><span class="rname">' + r.name + '</span><span class="track"><i style="width:' + pct + '%"></i></span><span class="small">' + (c.length ? ok + ' van ' + c.length : 'nog geen') + '</span></div>';
    }).join('') + '</div>';
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(addDays(t, -i));
    const active = new Set(ev.map(e => e.d));

    h += '<div class="dayl" aria-hidden="true">' + days.map(d => { const p = d.split('-').map(Number); return '<span>' + WD[new Date(p[0], p[1] - 1, p[2]).getDay()] + '</span>'; }).join('') + '</div>';
    const recent = ev.filter(e => e.k === 'check').slice(-8).reverse();
    if (recent.length) h += '<h3>Laatste toetsen</h3><ul class="hist">' + recent.map(e => {
      const it = state.items[e.item], r = routeOf(e), s = it && SONG[it.song];
      return '<li class="r-' + r + '"><span class="bar"></span><span>' + (s ? esc(s.title) : 'Verwijderd liedje') + '<br><span class="muted"><span class="rname">' + (ROUTE[r] ? ROUTE[r].name : '') + '</span>, ' + HELP[e.lvl] + ', ' + shortDate(e.d) + (e.auto ? ', met piano' : '') + '</span></span><span class="res ' + (e.ok ? 'ok' : 'no') + '">' + (e.ok ? 'gehaald' : 'niet gehaald') + '</span></li>';

  }

function exportText(){ return JSON.stringify({ app: 'drie-routes', v: 1, exported: new Date().toISOString(), state, songs: customSrc }); }
async function exportCopy(){

async function exportFile(){
  const name = 'drie-routes-' + today() + '.json', text = exportText();

    try { await cloud.dl.save({ filename: name, data: text }); ui.ioMsg = 'Bestand bewaard.'; }

function importText(text){
  let data = null;

  persist();
  ui.ioOpen = false;
  ui.ioMsg = 'Samengevoegd. ' + plural(Math.max(0, state.history.length - before), 'nieuwe gebeurtenis', 'nieuwe gebeurtenissen') + ' toegevoegd.';

    '<p>Daarom houdt de tool bij hoe vaak je de toetsen haalt. Dat is je eigen meetlat, onder Voortgang.</p>' +
    '<h3>Wat de tool niet doet</h3><ul class="plain">' +
    '<li>Zonder digitale piano hoort hij je niet. Dan beoordeel jij de toets, met de maatstaf hierboven.</li>' +
    '<li>Hij ziet je handen niet. Film jezelf af en toe om houding en spanning te bekijken.</li>' +
    '<li>Hoor je op een iPhone niets, zet dan de stille modus uit.</li></ul>' +
    '<h3>Muziek</h3><p class="small">De melodieën zijn volksliedjes en klassieke stukken, allemaal publiek domein. Bij de Ode is het ritme vereenvoudigd, de Canon is vereenvoudigd en naar C verplaatst. De akkoorden zijn eenvoudige keuzes, geen originele zettingen. De bladmuziek wordt getekend met abcjs.</p>';
}
const VIEWS = { vandaag: vandaagHTML, liedjes: liedjesHTML, voortgang: voortgangHTML, uitleg: uitlegHTML };

/* ---------- Acties ---------- */
function arm(el, label){
  if (el.dataset.armed === '1') return true;
  const old = el.textContent;
  el.dataset.armed = '1'; el.textContent = label;
  setTimeout(() => { if (el.isConnected){ el.dataset.armed = ''; el.textContent = old; } }, 4000);
  return false;
}
function beginSession(blocks, minutes, free){
  session = { blocks: blocks.slice(), i: 0, minutes, free, results: [], done: false, failedOpen: false, extraAdded: false, blockStart: Date.now() };
  ui.metro = false; ui.selBar = 0; echo.chunk = 0;
  requestWake();
  render(); window.scrollTo(0, 0);
}
function elapsedMin(){ return clamp(Math.round((Date.now() - session.blockStart) / 60000), 1, 60); }
function completePractice(){
  const c = cur();
  if (!c) return;
  const m = elapsedMin();
  recordPractice(c.b.id, m);
  session.results.push({ kind: 'practice', id: c.b.id, min: m });
  persist(); advance();
}
function completeCheck(ok){
  const c = cur();
  if (!c) return;
  const auto = rec.result && midi.status === 'on' ? rec.result : null;
  recordCheck(c.b.id, ok, auto);
  session.results.push({ kind: 'check', id: c.b.id, ok, min: CHECK_MIN });
  persist();
  if (ok) advance();
  else {
    const laterPractice = session.blocks.slice(session.i + 1).some(b => b.id === c.b.id && b.kind === 'practice');
    session.extraAdded = (!session.free && !laterPractice) ? insertExtra(c.b.id) : false;
    session.failNote = laterPractice ? 'Straks oefen je dit nog in deze sessie.' : session.extraAdded ? 'Er komt straks een extra oefenblok voor.' : 'Morgen komt dit opnieuw als toets.';
    session.failedOpen = true; render();
  }
}
function insertExtra(id){
  if (session.blocks.slice(session.i + 1).some(b => b.id === id && b.kind === 'practice')) return false;
  session.blocks.splice(Math.min(session.blocks.length, session.i + 2), 0, { kind: 'practice', id, min: blockLen(session.minutes), extra: true });
  return true;
}
function advance(){
  tStop(); mode = null;
  session.failedOpen = false; session.extraAdded = false; ui.metro = false; ui.selBar = 0; echo.chunk = 0; echo.listen = false;
  rec.key = ''; fol.key = '';
  session.i++; session.blockStart = Date.now();
  if (session.i >= session.blocks.length){
    releaseWake();
    if (session.free){ session = null; ui.tab = 'liedjes'; }
    else session.done = true;
  }
  render(); window.scrollTo(0, 0);
}
function stopSession(){
  releaseWake();
  if (session && session.results.length && !session.free) session.done = true;
  else session = null;
  render(); window.scrollTo(0, 0);
}
function moreTime(){
  const plan = buildPlan(5, new Set(session.results.map(r => r.id)));
  if (!plan.blocks.length){ const p = document.getElementById('moreMsg'); if (p) p.textContent = 'Er staat voor vandaag niets meer open.'; return; }
  const start = session.blocks.length;
  session.blocks = session.blocks.concat(plan.blocks);
  session.i = start; session.done = false; session.minutes = 5; session.blockStart = Date.now();
  requestWake(); render(); window.scrollTo(0, 0);
}
function toggleHard(el){
  const c = cur();
  if (!c) return;
  const n = +el.dataset.bar, set = new Set(c.it.hard);
  if (set.has(n)) set.delete(n); else set.add(n);
  c.it.hard = Array.from(set).sort((a, b) => a - b); c.it.t = Date.now();
  el.setAttribute('aria-pressed', set.has(n));
  markHard(); persist();
}
function changeTempo(d){
  const c = cur();
  if (!c) return;
  c.it.bpm = clamp(c.it.bpm + d, 40, 160); c.it.t = Date.now();
  const o = document.getElementById('bpm');
  if (o) o.textContent = c.it.bpm + ' bpm';
  persist();
  if (mode && mode !== 'echo') startMode(mode);
}
function resetAll(){
  state = freshState(); state.epochAt = Date.now();
  session = null; ui.minutes = null; ui.tab = 'vandaag';
  persist(); render(); window.scrollTo(0, 0);
}
const actions = {
  tab(el){ ui.tab = el.dataset.tab; ui.ioMsg = ''; render(); window.scrollTo(0, 0); },
  min(el){ ui.minutes = +el.dataset.min; keyNote(+el.dataset.note); render(); },
  start(){ if (!ui.minutes) return; const plan = buildPlan(ui.minutes); if (plan.blocks.length) beginSession(plan.blocks, ui.minutes, false); },
  startsong(el){ startSong(el.dataset.song); persist(); ui.tab = 'vandaag'; render(); window.scrollTo(0, 0); },
  free(el){ if (el.dataset.due === '1' && !arm(el, 'Toets van vandaag schuift dan naar morgen. Tik nogmaals.')) return; beginSession([{ kind: 'practice', id: el.dataset.id, min: 4 }], 4, true); },
  done(){ completePractice(); },
  checkok(){ completeCheck(true); },
  checkbad(){ completeCheck(false); },
  next(){ advance(); },
  stop(el){ if (arm(el, 'Tik nogmaals om te stoppen')) stopSession(); },
  hard(el){ toggleHard(el); },
  tempo(el){ changeTempo(+el.dataset.d); },
  metro(){
    ui.metro = !ui.metro;
    if (mode === 'listen' || mode === 'backing') startMode(mode);
    else if (ui.metro) startMode('metro');
    else stopAudio();
  },
  listen(){ if (mode === 'listen') stopAudio(); else startMode('listen'); },
  backing(){ if (mode === 'backing'){ stopAudio(); if (rec.on){ rec.on = false; } if (ui.metro) startMode('metro'); } else startMode('backing'); },
  echo(){ if (mode === 'echo') stopAudio(); else startMode('echo'); },
  echonext(){ echo.chunk++; echo.listen = false; stopAudio(); render(); },
  selbar(el){
    const c = cur();
    if (!c) return;
    ui.selBar = +el.dataset.bar;
    document.querySelectorAll('#chart button').forEach((x, i) => x.classList.toggle('sel', c.lvl === 2 && i === ui.selBar));
    if (c.lvl === 2 && mode !== 'backing') renderKb(c, barChords(c.song, ui.selBar)[0]);
  },
  more(){ moreTime(); },
  finish(){ session = null; releaseWake(); render(); window.scrollTo(0, 0); },
  reset(el){ if (arm(el, 'Tik nogmaals om alles te wissen')) resetAll(); },
  midi(){ if (midi.status !== 'on') midiConnect(); },
  midicard(){ dev.midiCard = false; saveDev(); renderMidiBits(); },
  recdone(){ finishRec(); },
  recreset(){ resetRec(); },
  newsong(){ ui.edit = { id: null, title: '', meter: '4/4', key: 'C', abc: '' }; render(); window.scrollTo(0, 0); },
  editsong(el){ const s = customSrc[el.dataset.song]; if (!s) return; ui.edit = { id: s.id, title: s.title, meter: s.meter, key: s.key, abc: s.abc }; render(); window.scrollTo(0, 0); },
  delsong(el){ if (arm(el, 'Tik nogmaals: ook de voortgang van dit liedje gaat weg')) deleteSong(el.dataset.song); },
  edcancel(){ ui.edit = null; tStop(); mode = null; render(); window.scrollTo(0, 0); },
  edsave(){ editorSave(); },
  edplay(){ editorPlay(); },
  export(){ exportCopy(); },
  exportfile(){ exportFile(); },
  ioopen(){ ui.ioOpen = !ui.ioOpen; ui.ioMsg = ''; render(); },
  import(){ const ta = document.getElementById('f-import'); importText(ta ? ta.value : ''); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !app.contains(el)) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => { const el = e.target; if (el && el.dataset && el.dataset.in && app.contains(el)) onEditorInput(el); });
document.addEventListener('change', e => {
  const el = e.target;
  if (!el || !app.contains(el)) return;
  if (el.dataset && el.dataset.in) onEditorInput(el);
  if (el.id === 'f-file' && el.files && el.files[0]){ const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(el.files[0]); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && isBusy()) requestWake(); });
let rsz = null;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => {
    const c = cur(), el = document.getElementById('score');
    if (!c || !el || c.it.route === 'impro') return;
    if (((el.clientWidth || 340) < 520 ? 2 : 4) !== scorePer) renderScore(c);
  }, 200);
});
function loadAbc(k){
  const s = document.createElement('script');
  s.src = ABCJS_URLS[k || 0]; s.async = true;
  s.onload = () => { abcState = 'ready'; redrawScores(); };
  s.onerror = () => { if ((k || 0) + 1 < ABCJS_URLS.length) loadAbc((k || 0) + 1); else { abcState = 'failed'; redrawScores(); } };
  document.head.appendChild(s);
}
function redrawScores(){
  const c = cur();
  if (c && c.it.route !== 'impro') renderScore(c);
  if (!isBusy() && ui.edit) afterEditor();
}

/* ---------- Testhaak, alleen met #test ---------- */
if (location.hash === '#test') window.__dr = { parseAbc, makeSong, abcFor, buildPlan, alignSeq, judgePlay, judgeImpro, countStops, expectedSeq, folSteps, chordInfo, normKey, lhRoot, lhFinger, safeNotes, voicing, BUILTIN, get state(){ return state; }, get session(){ return session; }, get fol(){ return fol; }, get rec(){ return rec; }, midi };

/* ---------- Start ---------- */
const hot = window.claude && window.claude.hot;
function boot(data){
  try {
    if (data && data.session && Array.isArray(data.session.blocks)){ session = data.session; Object.assign(ui, data.ui || {}); }
  } catch (e) { session = null; }
  loadAbc(0);
  render();
  initCloud();
  midiAutoConnect();
}
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ session: clone(session), ui: { tab: ui.tab, minutes: ui.minutes, selBar: ui.selBar } })); } catch (e) { /* geen hot reload */ }
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
